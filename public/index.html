<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Un Mercato</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box" id="login-box">
            <h2>Login</h2>
            <p>Enter your email and password to login.</p>
            <input type="email" id="login-email" placeholder="Email" required>
            <input type="password" id="login-password" placeholder="Password" required>
            <button id="login-btn">Sign In</button>
            <div class="quick-login-container">
                <button id="quick-login-admin-btn" class="quick-login-btn">Quick Login as Admin</button>
                <button id="quick-login-user-btn" class="quick-login-btn">Quick Login as User</button>
            </div>
            <p class="auth-switch">Don't have an account? <a href="#" id="show-register">Register</a></p>
        </div>

        <div class="auth-box" id="register-box" style="display: none;">
            <h2>Register</h2>
            <p>Create an account to get started.</p>
            <input type="email" id="register-email" placeholder="Email" required>
            <input type="password" id="register-password" placeholder="Password" required>
            <button id="register-btn">Register</button>
            <p class="auth-switch">Already have an account? <a href="#" id="show-login">Login</a></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
        import { firebaseConfig } from "/js/firebase-config.js";

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Get references to the HTML elements
        const loginBox = document.getElementById('login-box');
        const registerBox = document.getElementById('register-box');
        const showRegister = document.getElementById('show-register');
        const showLogin = document.getElementById('show-login');
        const loginBtn = document.getElementById('login-btn');
        const registerBtn = document.getElementById('register-btn');
        const quickLoginAdminBtn = document.getElementById('quick-login-admin-btn');
        const quickLoginUserBtn = document.getElementById('quick-login-user-btn');

        // Switch between login and register forms
        showRegister.addEventListener('click', (event) => {
            event.preventDefault();
            loginBox.style.display = 'none';
            registerBox.style.display = 'block';
        });

        showLogin.addEventListener('click', (event) => {
            event.preventDefault();
            registerBox.style.display = 'none';
            loginBox.style.display = 'block';
        });

        // Handle login
        loginBtn.addEventListener('click', () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            signInWithEmailAndPassword(auth, email, password)
                .catch((error) => {
                    console.error('Error logging in: ', error);
                    alert('Error logging in: ' + error.message);
                });
        });

        // Handle quick login
        quickLoginAdminBtn.addEventListener('click', () => {
            signInWithEmailAndPassword(auth, 'yothanan@gmail.com', 'qqhu64vh')
                .catch((error) => {
                    console.error('Error logging in as admin: ', error);
                    alert('Error logging in as admin: ' + error.message);
                });
        });

        quickLoginUserBtn.addEventListener('click', () => {
            signInWithEmailAndPassword(auth, 'user@user.com', '123456')
                .catch((error) => {
                    console.error('Error logging in as user: ', error);
                    alert('Error logging in as user: ' + error.message);
                });
        });

        // Handle registration
        registerBtn.addEventListener('click', () => {
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // User created, now create their document in Firestore
                    const user = userCredential.user;
                    const userDocRef = doc(db, "users", user.uid);
                    return setDoc(userDocRef, {
                        role: 'user',
                        email: email // Optional: store the email as well
                    });
                })
                .catch((error) => {
                    console.error('Error signing up: ', error);
                    if (error.code === 'auth/email-already-in-use') {
                        alert('This email is already in use. Please use a different email or log in.');
                    } else {
                        alert('Error signing up: ' + error.message);
                    }
                });
        });

        // Handle auth state changes and role-based redirect
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // User is signed in, check their role
                document.body.innerHTML = '<h1>Welcome! Checking your role and redirecting...</h1>';

                const userDocRef = doc(db, "users", user.uid);
                try {
                    const userDoc = await getDoc(userDocRef);
                    if (userDoc.exists()) {
                        const userData = userDoc.data();
                        if (userData.role === 'admin') {
                            // Redirect to admin dashboard
                            window.location.href = '/admin/';
                        } else {
                            // Redirect to user products page
                            window.location.href = '/user/products.html';
                        }
                    } else {
                        // If user document doesn't exist, default to products page
                        console.error("User document not found in Firestore.");
                        window.location.href = '/user/products.html';
                    }
                } catch (error) {
                    console.error("Error getting user document:", error);
                    // If there's an error, default to products page
                    window.location.href = '/user/products.html';
                }
            }
        });
    </script>
</body>
</html>
