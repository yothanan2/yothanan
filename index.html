<!DOCTYPE html>
<html>
<head>
  <title>Kitchen Management</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <h1>Kitchen Management</h1>

  <div id="auth-container">
    <input type="email" id="email-input" placeholder="Email">
    <input type="password" id="password-input" placeholder="Password">
    <button id="signup-btn">Sign Up</button>
    <button id="login-btn">Log In</button>
  </div>

  <div id="user-container" style="display: none;">
    <p>Welcome, <span id="user-email"></span>!</p>
    <button id="logout-btn">Log Out</button>
  </div>

  <div id="mise-en-place" style="display: none;">
    <h2>Mise en Place (To-Do List)</h2>
    <input type="text" id="new-task-input" placeholder="Add a new task">
    <button id="add-task-btn">Add</button>
    <ul id="task-list"></ul>
  </div>

  <!-- NOTE: You will need to create a firebase-config.js file with your own credentials. -->
  <!-- See firebase-config.js.template for an example. -->
  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy, doc, deleteDoc, setDoc, where } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
    import { firebaseConfig } from "./firebase-config.js";

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Get references to the HTML elements
    const authContainer = document.getElementById('auth-container');
    const userContainer = document.getElementById('user-container');
    const miseEnPlaceContainer = document.getElementById('mise-en-place');
    const emailInput = document.getElementById('email-input');
    const passwordInput = document.getElementById('password-input');
    const signupBtn = document.getElementById('signup-btn');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userEmail = document.getElementById('user-email');
    const newTaskInput = document.getElementById('new-task-input');
    const addTaskBtn = document.getElementById('add-task-btn');
    const taskList = document.getElementById('task-list');

    // Add a new task to Firestore
    const addTask = () => {
      const taskText = newTaskInput.value.trim();
      const user = auth.currentUser;
      if (taskText !== '' && user) {
        addDoc(collection(db, 'tasks'), {
          text: taskText,
          createdAt: serverTimestamp(),
          userId: user.uid
        })
        .then(() => {
          newTaskInput.value = '';
        })
        .catch((error) => {
          console.error('Error adding task: ', error);
        });
      }
    };

    addTaskBtn.addEventListener('click', addTask);

    // Delete a task from Firestore
    const deleteTask = (event) => {
      if (event.target.classList.contains('delete-btn')) {
        const id = event.target.getAttribute('data-id');
        deleteDoc(doc(db, 'tasks', id));
      }
    };

    taskList.addEventListener('click', deleteTask);

    // Auth state listener
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // User is signed in
        authContainer.style.display = 'none';
        userContainer.style.display = 'block';
        miseEnPlaceContainer.style.display = 'block';
        userEmail.textContent = user.email;

        // Listen for real-time updates from Firestore
        const q = query(collection(db, 'tasks'), where("userId", "==", user.uid), orderBy('createdAt'));
        onSnapshot(q, (snapshot) => {
          taskList.innerHTML = '';
          snapshot.forEach((doc) => {
            const task = doc.data();
            const li = document.createElement('li');
            li.innerHTML = `
              <span>${task.text}</span>
              <button class="delete-btn" data-id="${doc.id}">Delete</button>
            `;
            taskList.appendChild(li);
          });
        });

      } else {
        // User is signed out
        authContainer.style.display = 'block';
        userContainer.style.display = 'none';
        miseEnPlaceContainer.style.display = 'none';
      }
    });

    // Sign up a new user
    signupBtn.addEventListener('click', () => {
      const email = emailInput.value;
      const password = passwordInput.value;
      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          // The Cloud Function will handle creating the user document.
        })
        .catch((error) => {
          console.error('Error signing up: ', error);
        });
    });

    // Log in an existing user
    loginBtn.addEventListener('click', () => {
      const email = emailInput.value;
      const password = passwordInput.value;
      signInWithEmailAndPassword(auth, email, password)
        .catch((error) => {
          console.error('Error logging in: ', error);
        });
    });

    // Log out the current user
    logoutBtn.addEventListener('click', () => {
      signOut(auth);
    });
  </script>
</body>
</html>
