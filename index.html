<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Un Mercato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box" id="login-box">
            <h2>Login</h2>
            <p>Enter your email and password to login.</p>
            <input type="email" id="login-email" placeholder="Email" required>
            <input type="password" id="login-password" placeholder="Password" required>
            <button id="login-btn">Sign In</button>
            <p class="auth-switch">Don't have an account? <a href="#" id="show-register">Register</a></p>
        </div>

        <div class="auth-box" id="register-box" style="display: none;">
            <h2>Register</h2>
            <p>Create an account to get started.</p>
            <input type="email" id="register-email" placeholder="Email" required>
            <input type="password" id="register-password" placeholder="Password" required>
            <button id="register-btn">Register</button>
            <p class="auth-switch">Already have an account? <a href="#" id="show-login">Login</a></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        import { firebaseConfig } from "./firebase-config.js";

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Get references to the HTML elements
        const loginBox = document.getElementById('login-box');
        const registerBox = document.getElementById('register-box');
        const showRegister = document.getElementById('show-register');
        const showLogin = document.getElementById('show-login');
        const loginBtn = document.getElementById('login-btn');
        const registerBtn = document.getElementById('register-btn');

        // Switch between login and register forms
        showRegister.addEventListener('click', (event) => {
            event.preventDefault();
            loginBox.style.display = 'none';
            registerBox.style.display = 'block';
        });

        showLogin.addEventListener('click', (event) => {
            event.preventDefault();
            registerBox.style.display = 'none';
            loginBox.style.display = 'block';
        });

        // Handle login
        loginBtn.addEventListener('click', () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            signInWithEmailAndPassword(auth, email, password)
                .catch((error) => {
                    console.error('Error logging in: ', error);
                    alert('Error logging in: ' + error.message);
                });
        });

        // Handle registration
        registerBtn.addEventListener('click', () => {
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            createUserWithEmailAndPassword(auth, email, password)
                .catch((error) => {
                    console.error('Error signing up: ', error);
                    alert('Error signing up: ' + error.message);
                });
        });

        // Handle auth state changes
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in, redirect to the main page
                document.body.innerHTML = '<h1>Welcome! Redirecting...</h1>';
                // In a real application, you would redirect to the main page:
                window.location.href = 'products.html';
            }
        });
    </script>
</body>
</html>
